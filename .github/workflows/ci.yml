name: CI

on:
  push:
    branches: [main, develop, 'main-*', 'feature/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install (locked)
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.lock
          pip install pip-audit
      - name: Dependency audit
        run: pip-audit -r backend/requirements.lock --strict || echo "::warning::pip-audit reported findings"
      - name: Tests
        working-directory: backend
        env:
          EDD_FAST_HASH: '1'
        run: python -m pytest -q --maxfail=5

  frontend:
    name: Frontend (tsc + build + audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Dependency audit (high+)
        run: npm audit --audit-level=high || echo "::warning::npm audit reported findings"
      - name: Type-check
        run: npx tsc -b
      - name: Build
        run: npm run build
      - name: Bundle size report
        run: du -sk dist/assets/*.js | sort -rn | head -8

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: delivery-dashboard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

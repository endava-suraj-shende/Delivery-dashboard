name: CI

on:
  push:
    branches: [main, develop, 'main-*', 'feature/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install (locked)
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.lock
          pip install pip-audit
      - name: Dependency audit
        run: pip-audit -r backend/requirements.lock --strict || echo "::warning::pip-audit reported findings"
      - name: Tests
        working-directory: backend
        env:
          EDD_FAST_HASH: '1'
        run: python -m pytest -q --maxfail=5
      - name: Intelligence tests
        run: python -m pytest intelligence/tests -q

  frontend:
    name: Frontend (tsc + build + audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Dependency audit (high+)
        run: npm audit --audit-level=high || echo "::warning::npm audit reported findings"
      - name: Type-check
        run: npx tsc -b
      - name: Build
        run: npm run build
      - name: Bundle size report
        run: du -sk dist/assets/*.js | sort -rn | head -8

  e2e:
    name: End-to-end (Playwright, demo data)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10', cache: pip, cache-dependency-path: backend/requirements.lock }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: pip install -r backend/requirements.lock
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start backend (fresh SQLite, Excel mode with no workbooks, demo accounts self-heal)
        working-directory: backend
        env:
          EDD_ENVIRONMENT: ci
          EDD_COOKIE_SECURE: '0'
          EDD_DATA_DIR: ${{ github.workspace }}/Data
          EDD_DATABASE_URL: sqlite:///${{ github.workspace }}/storage/ci.db
          EDD_RATE_LIMIT_AUTH_PER_MINUTE: '1000'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/Data" "$GITHUB_WORKSPACE/storage"
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$GITHUB_WORKSPACE/backend.log" 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8000/api/v1/auth/options >/dev/null && break; sleep 2; done
      - name: Start frontend
        working-directory: frontend
        run: |
          nohup npm run dev -- --host localhost --port 5173 > "$GITHUB_WORKSPACE/frontend.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:5173/ >/dev/null && break; sleep 2; done
      - run: npx playwright test
        working-directory: frontend
        env: { CI: 'true' }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
            backend.log
            frontend.log

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: delivery-dashboard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
